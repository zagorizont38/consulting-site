<!DOCTYPE html>

<head>

<title>Страница не найдена — Юлия Разумовская</title>

<style>

  .nf p { margin: 0 auto 30px; max-width: 30em; color: var(--muted); }
  .nf svg.paw { width: 56px; height: 56px; margin: 0 auto 10px; fill: var(--navy-700); opacity: .18; transform: rotate(-14deg); }
</style>

<body>
<main class="nf">
  <div class="container">
    <svg class="paw" viewBox="0 0 64 64" aria-hidden="true">

    <p class="nf__num" aria-hidden="true">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Всё главное — на первой странице.</p>
    <a class="btn btn--primary btn--lg" href="index.html">На главную</a>
